<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <title>Login | Portofolio Nurul Hafifah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Nama<span class="text-info">Nurul Hafifah</span>.dev</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Proyek</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Tentang</a></li>
        <li class="nav-item"><a class="btn btn-info btn-sm ms-lg-3 mt-2 mt-lg-0 active" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <h1 class="h3 fw-bold text-center mb-4">Login</h1>

          <!-- Tempat pesan alert dari JavaScript -->
          <div id="pesan"></div>

          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="contoh@email.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
            </div>
            <button type="submit" class="btn btn-dark w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white-50 text-center py-3 fixed-bottom">
